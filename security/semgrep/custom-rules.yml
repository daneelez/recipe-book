rules:
  - id: recipe-book.hardcoded-secret
    message: >-
      Hardcoded secret detected. Use environment variables (process.env)
      and never commit secrets to the repository.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR = "$SECRET"
          - pattern: |
              let $VAR = "$SECRET"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|secret|api_?key|token|jwt).*
      - metavariable-regex:
          metavariable: $SECRET
          regex: .{8,}

  - id: recipe-book.eval-user-input
    message: >-
      eval() with user input may lead to remote code execution (RCE).
      Use JSON.parse() or safe parsers instead.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
    pattern: eval($INPUT)

  - id: recipe-book.sql-string-concat
    message: >-
      SQL query built via string concatenation — SQL injection risk.
      Use parameterized queries (Prisma, prepared statements).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: |
          $DB.query("..." + $USER + "...")
      - pattern: |
          $DB.query(`...${$USER}...`)

  - id: recipe-book.path-traversal
    message: >-
      File path built from user input without normalization — path traversal risk.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"
      owasp: "A01:2021 - Broken Access Control"
    pattern-either:
      - pattern: path.join($BASE, req.query.filename)
      - pattern: path.join($BASE, req.query.$KEY)

  - id: recipe-book.missing-rate-limit-upload
    message: >-
      File upload endpoint without explicit rate limiting — DoS/abuse risk.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration"
    pattern: |
      app.post($PATH, upload.$METHOD(...), ...)

  - id: recipe-book.dangerously-set-inner-html
    message: >-
      dangerouslySetInnerHTML without sanitization — XSS risk.
      Use DOMPurify or render text safely.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    pattern: |
      <$E dangerouslySetInnerHTML={$PROPS} />
